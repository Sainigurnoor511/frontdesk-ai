# Runs the auth suites that encode the two-factor and password-reset contract:
# the MFA attempt budget against a real Redis, so the Lua scripts' guarantees
# (atomic reservation, a TTL on every write, release never below zero, a
# recovery refill claimed only when it clears something) are checked somewhere
# reproducible, plus the gate, signed recovery claim, /callback routing, reset
# page, auth action, proxy and assistant route suites, which need no Redis.
#
# Deliberately these files, not the whole Vitest suite: the full suite still has
# known pre-existing failures (developer-docs/TODO.md, "Known Technical
# Issues"), so a full-suite job would be red for reasons unrelated to auth.
#
# No secrets needed. The service is redis:7-alpine, matching docker-compose.yml
# (the release script's SET ... KEEPTTL needs Redis >= 6.0).
name: Auth and MFA
on:
  pull_request:
    paths:
      - "lib/auth/**"
      - "app/(auth)/**"
      - "app/api/**"
      - "proxy.ts"
      - "proxy.test.ts"
      - ".github/workflows/mfa-attempts.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mfa-attempts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vitest:
    name: Auth and MFA tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      # A dedicated DB so the test's keys never share a keyspace with anything.
      MFA_REDIS_TEST_URL: redis://127.0.0.1:6379/15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # package.json has no `packageManager` field, so the action needs an
          # explicit version or it errors out.
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check the Redis service answers
        # The live cases skip when no server answers, so a broken service would
        # otherwise show up as a green run that proved nothing.
        run: |
          node -e "
          const net = require('node:net');
          const socket = net.connect(6379, '127.0.0.1', () => socket.write('PING\r\n'));
          socket.setTimeout(5000, () => { console.error('Redis did not answer'); process.exit(1); });
          socket.on('data', (d) => { if (!String(d).startsWith('+PONG')) process.exit(1); socket.end(); });
          socket.on('error', (e) => { console.error(e.message); process.exit(1); });
          "
      - name: Run the auth and MFA tests
        # Quoted: the route group's parentheses are shell syntax.
        run: >-
          pnpm exec vitest run
          lib/auth/mfa-attempts.test.ts
          lib/auth/mfa.test.ts
          lib/auth/recovery.test.ts
          "app/(auth)/callback/route.test.ts"
          "app/(auth)/callback/route.recovery-cap.test.ts"
          "app/(auth)/actions.test.ts"
          "app/(auth)/reset-password/page.test.tsx"
          app/api/assistant/route.test.ts
          proxy.test.ts
