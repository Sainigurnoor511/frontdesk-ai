name: frontdesk-ai

services:
  # ── Redis ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Nginx reverse proxy ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-cache:/var/cache/nginx/static
    depends_on:
      - app

  # ── Next.js app ─────────────────────────────────────────────────
  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env.local
    environment:
      REDIS_URL: redis://redis:6379/0

  # ── BullMQ workers ─────────────────────────────────────────────
  # One process hosts every queue: website scanning, knowledge indexing, outbound
  # webhooks, and AssemblyAI transcript retrieval. These were four containers that
  # differed only in queue name and concurrency, so they were paying four Node
  # runtimes' baseline memory to run identical boilerplate.
  #
  # To peel one back out for independent scaling, add a second service with the
  # same image and set WORKER_QUEUES on both — no code change needed. For example
  # WORKER_QUEUES=knowledge-indexing here and the rest on another service.
  worker-jobs:
    image: frontdesk-ai-worker:local
    build:
      context: .
      target: worker
    restart: unless-stopped
    command: ["node", "--import", "tsx", "workers/jobs.ts"]
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env.local
    environment:
      REDIS_URL: redis://redis:6379/0

  # Stays separate on purpose. It bootstraps through LiveKit's agent CLI, which
  # forks child processes that re-import its module — a BullMQ Worker declared
  # there would be duplicated into every fork. It also owns argv and signals.
  worker-voice:
    build:
      context: .
      target: worker-voice
    restart: unless-stopped
    command: ["node", "--import", "tsx", "workers/voice-agent.ts", "start"]
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env.local
    environment:
      REDIS_URL: redis://redis:6379/0

volumes:
  redis-data:
  nginx-cache:
